# Nominal geometry used by the URDF, in metres and radians. Models without
# overrides retain the historical default layout. A null sensor position means
# that no frame is generated; a null IMU means its transform is not defined.
defaults:
  mesh_xyz: "0 0 0"
  rgb_xyz: "0 0 0"
  left_xyz: "0 0.0375 0"
  right_xyz: "0 -0.0375 0"
  right_name: null
  imu_xyz: null
  imu_rpy: null

models:
  OAK-D:
    imu_xyz: "0.0 -0.015 -0.013662"
    imu_rpy: "0.0 1.5707963267948966 0.0"
  OAK-D-PRO:
    imu_xyz: "-0.008 -0.037945 -0.00079"
    imu_rpy: "3.141592653589793 1.5707963267948966 0.0"
  OAK-D-POE:
    imu_xyz: "-0.008 -0.04 -0.020265"
    imu_rpy: "3.141592653589793 1.5707963267948966 0.0"
  OAK-D-SR:
    rgb_xyz: null
    left_xyz: "0 0.01 0"
    right_xyz: "0 -0.01 0"
  OAK-D-LR:
    left_xyz: "0 0.1 0"
    right_xyz: "0 -0.05 0"
  OAK-D-SR-POE:
    mesh_xyz: "0.019 0 0"
    left_xyz: "0 0.0375 0"
    right_xyz: "0 0.0175 0"
  OAK-T:
    left_xyz: null
    right_xyz: "0 -0.025 0"
    right_name: cam_e
